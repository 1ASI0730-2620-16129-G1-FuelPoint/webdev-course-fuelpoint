<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Errores corregidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ERROR 1 corregido: la etiqueta que abre y la que cierra deben ser iguales (h1 ... /h1) -->
  <h1>Mis deportes favoritos</h1>

  <!-- ERROR 2 corregido: faltaba cerrar el párrafo con </p> -->
  <p class="destacado">Estos son los deportes que más practico.</p>

  <ul>
    <li>Fútbol</li>
    <li>Vóley</li>
    <li>Básquet</li>
  </ul>

  <!-- ERROR 3 corregido: toda imagen necesita un texto alternativo (alt) -->
  <img src="https://placehold.co/300x200/e2462a/white?text=Deportes" alt="Imagen de ejemplo con el texto Deportes" width="300">

  <!-- ERROR 4 corregido: los enlaces a otras páginas necesitan https:// al inicio -->
  <p>Aprende más en <a href="https://developer.mozilla.org/es/">MDN</a></p>

  <!-- CONSEJOS:
       1. Cierra cada etiqueta apenas la abras, y luego escribe en medio.
       2. Usa sangría (espacios) para ver qué está dentro de qué.
       3. Revisa tu HTML gratis en https://validator.w3.org/
       4. ¿Dudas? Busca la etiqueta en https://developer.mozilla.org/es/ -->
</body>
</html>
