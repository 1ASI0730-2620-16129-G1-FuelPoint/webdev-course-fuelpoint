<!DOCTYPE html>
<html lang="es">
<head>
  <!-- El <head> guarda información sobre la página (no se ve en pantalla) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre mí</title>
</head>
<body>
  <!-- El <body> guarda todo lo que SÍ se ve en pantalla -->

  <!-- Elemento = etiqueta de apertura + contenido + etiqueta de cierre -->
  <h1>Hola, soy Alex</h1>
  <p>Tengo 14 años y estoy aprendiendo a crear páginas web.</p>

  <!-- Atributo = información extra que va dentro de la etiqueta de apertura -->
  <p title="¡Hola! Soy un atributo title">Pasa el mouse sobre este párrafo.</p>
</body>
</html>
