<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre mí</title>
</head>
<body>
  <!-- h1 es el título más importante; solo debe haber uno por página -->
  <h1>Hola, soy Alex</h1>
  <p>Tengo 14 años y estoy aprendiendo a crear páginas web.</p>

  <!-- h2 sirve para los subtítulos de cada parte -->
  <h2>Mis pasatiempos</h2>
  <!-- ul = lista SIN orden (con viñetas) -->
  <ul>
    <li>Jugar fútbol</li>
    <li>Escuchar música</li>
    <li>Dibujar</li>
  </ul>

  <h2>Mi top 3 de comidas</h2>
  <!-- ol = lista CON orden (numerada) -->
  <ol>
    <li>Pizza</li>
    <li>Arroz con pollo</li>
    <li>Helado</li>
  </ol>

  <p>Mi meta es crear <strong>mi propia página web</strong> este año.</p>
</body>
</html>
